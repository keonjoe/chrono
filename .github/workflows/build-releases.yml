name: Build and release prebuilt packages

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: write

# a newer push supersedes an unfinished build of the same ref
concurrency:
  group: chrono-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-24.04, ext: tar.gz }
          - { name: windows-x86_64, os: windows-2022, ext: zip }
          - { name: macos-arm64,    os: macos-latest, ext: tar.gz }
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Chrono
        uses: actions/checkout@v4

      # ---- System dependencies ----------------------------------------------------------------
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libeigen3-dev pkg-config
          # Intel oneMKL (Chrono::PardisoMKL sparse direct solver); optional, skipped if unavailable
          if wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
               | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null \
             && echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
               | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null \
             && sudo apt-get update && sudo apt-get install -y intel-oneapi-mkl-devel; then
            MKL=/opt/intel/oneapi/mkl/latest
            echo "MKLROOT=$MKL" >> "$GITHUB_ENV"
            echo "CMAKE_PREFIX_PATH=$MKL" >> "$GITHUB_ENV"
          else
            echo "::warning::oneMKL not available, Chrono::PardisoMKL will not be built"
          fi

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja eigen libomp

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$(cygpath -w "$RUNNER_TEMP/vcpkg-cache")" >> "$GITHUB_ENV"
          echo "CMAKE_TOOLCHAIN_FILE=$(cygpath -m "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake")" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.name }}-eigen3-v1

      - name: Install Eigen with vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install eigen3 --triplet x64-windows

      # Intel oneMKL for Chrono::PardisoMKL (conda-forge package: headers, import libs, DLLs, CMake config)
      - name: Install oneMKL (Windows)
        if: runner.os == 'Windows'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: mkl
          create-args: mkl-devel
          micromamba-root-path: ${{ runner.temp }}/micromamba
          cache-environment: true
          init-shell: none

      - name: Configure oneMKL (Windows)
        if: runner.os == 'Windows'
        run: |
          MKL="$(cygpath -m "$RUNNER_TEMP/micromamba/envs/mkl/Library")"
          [ -f "$MKL/lib/cmake/mkl/MKLConfig.cmake" ] || { echo "::error::MKLConfig.cmake not found under $MKL"; ls "$MKL/lib" | head -30; exit 1; }
          echo "MKLROOT=$MKL" >> "$GITHUB_ENV"

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---- Thrust 1.17.2 headers (Chrono::Multicore, OpenMP back end; no CUDA needed) -----------
      # Newer libc++ versions removed the `_VSTD` macro used by this release (see
      # contrib/build-scripts/macos/buildThrust.sh), so it is replaced by `std`.
      - name: Fetch Thrust
        run: |
          DEPS="$RUNNER_TEMP/deps"
          mkdir -p "$DEPS"
          curl -fsSL -o "$DEPS/thrust.tar.gz" https://github.com/NVIDIA/thrust/archive/refs/tags/1.17.2.tar.gz
          tar -xzf "$DEPS/thrust.tar.gz" -C "$DEPS"
          perl -pi -e 's/_VSTD::__wrap_iter/std::__wrap_iter/g' "$DEPS/thrust-1.17.2/thrust/type_traits/is_contiguous_iterator.h"
          THRUST="$DEPS/thrust-1.17.2"
          if command -v cygpath >/dev/null; then THRUST="$(cygpath -m "$THRUST")"; fi
          echo "THRUST_DIR=$THRUST" >> "$GITHUB_ENV"

      # ---- Build & install Spectra (develop branch, required by Chrono::Modal) -----------------
      - name: Build and install Spectra
        run: |
          PREFIX="$GITHUB_WORKSPACE/install"
          mkdir -p "$PREFIX"
          NPREFIX="$PREFIX"
          if command -v cygpath >/dev/null; then NPREFIX="$(cygpath -m "$PREFIX")"; fi

          echo "== fetching Spectra (develop branch)"
          SRC="$RUNNER_TEMP/spectra-src"
          BLD="$RUNNER_TEMP/spectra-build"
          git clone -q -c advice.detachedHead=false --depth 1 --branch develop https://github.com/yixuan/spectra.git "$SRC"

          if command -v cygpath >/dev/null; then
            SRC="$(cygpath -m "$SRC")"
            BLD="$(cygpath -m "$BLD")"
          fi

          OPT=()
          [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ] && OPT+=(-DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE")
          command -v ninja >/dev/null && OPT+=(-G Ninja)

          cmake -S "$SRC" -B "$BLD" "${OPT[@]}" \
            -DCMAKE_INSTALL_PREFIX="$NPREFIX" -DCMAKE_BUILD_TYPE=Release
          cmake --install "$BLD"

      # ---- Build & install Project Chrono -----------------------------------------------------
      - name: Configure Chrono
        run: |
          PREFIX="$GITHUB_WORKSPACE/install"
          NPREFIX="$PREFIX"
          if command -v cygpath >/dev/null; then NPREFIX="$(cygpath -m "$PREFIX")"; fi

          OPT=()
          command -v ninja >/dev/null && OPT+=(-G Ninja)

          if [ -n "${MKLROOT:-}" ]; then
            OPT+=(-DCH_ENABLE_MODULE_PARDISO_MKL=ON)
            for d in "$MKLROOT/lib/cmake/mkl" "$MKLROOT/lib/intel64/cmake/mkl"; do
              [ -f "$d/MKLConfig.cmake" ] && { OPT+=(-DMKL_DIR="$d"); break; }
            done
            echo "== MKLROOT=$MKLROOT: enabling Chrono::PardisoMKL"
          fi

          if [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]; then
            OPT+=(-DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE")
          fi

          if [ "${{ runner.os }}" = "Linux" ]; then
            OPT+=(-DCMAKE_INSTALL_RPATH='$ORIGIN')
          elif [ "${{ runner.os }}" = "macOS" ]; then
            OPT+=(-DCMAKE_INSTALL_RPATH='@loader_path')
            # Apple clang has no bundled OpenMP runtime: Homebrew's libomp
            LIBOMP="$(brew --prefix libomp)"
            OPT+=(-DOpenMP_ROOT="$LIBOMP"
                  -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I$LIBOMP/include" -DOpenMP_C_FLAGS="-Xclang -fopenmp -I$LIBOMP/include"
                  -DOpenMP_CXX_LIB_NAMES=omp -DOpenMP_C_LIB_NAMES=omp -DOpenMP_omp_LIBRARY="$LIBOMP/lib/libomp.dylib")
          fi

          # Chrono::Multicore (OpenMP + Thrust); required by OpenMultiPhysics
          OPT+=(-DCH_ENABLE_MODULE_MULTICORE=ON -DCH_ENABLE_OPENMP=ON -DThrust_ROOT="$THRUST_DIR" -DTHRUST_INCLUDE_DIR="$THRUST_DIR")

          cmake -S . -B build "${OPT[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$NPREFIX" \
            -DCMAKE_PREFIX_PATH="$NPREFIX" \
            -Dspectra_DIR="$NPREFIX/share/spectra/cmake" \
            -DBUILD_DEMOS=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCHMARKING=OFF \
            -DCH_ENABLE_MODULE_MODAL=ON \
            -DCH_ENABLE_MODULE_VEHICLE=ON \
            -DCH_ENABLE_MODULE_VEHICLE_MODELS=ON \
            -DCH_ENABLE_MODULE_PERIDYNAMICS=ON

      - name: Build Chrono
        run: |
          cmake --build build --config Release --parallel

      - name: Install Chrono
        run: |
          cmake --install build --config Release
          CFG="$(find install -name ChronoConfig.cmake | head -1)"
          # every package must ship Chrono::Multicore
          grep -Eqi 'Chrono_MULTICORE_AVAILABLE[[:space:]]+(ON|TRUE|1)\b' "$CFG" \
            || { echo "::error::Chrono::Multicore missing from the installed package"; exit 1; }
          # Linux / Windows packages must ship Chrono::PardisoMKL (macOS has no oneMKL, OpenMultiPhysics
          # uses Apple Accelerate there)
          if [ "${{ runner.os }}" != "macOS" ]; then
            grep -Eqi 'Chrono_PARDISOMKL_AVAILABLE[[:space:]]+(ON|TRUE|1)\b' "$CFG" \
              || { echo "::error::Chrono::PardisoMKL missing from the installed package"; exit 1; }
          fi

      # ---- Package preparation & archiving ----------------------------------------------------
      - name: Prepare and archive package
        run: |
          PREFIX="$GITHUB_WORKSPACE/install"

          # Ensure all exported target include directories exist
          for d in chrono chrono_modal chrono_vehicle chrono_models/vehicle chrono_peridynamics chrono_pardisomkl chrono_multicore; do
            mkdir -p "$PREFIX/include/$d"
          done

          # Chrono::Multicore headers include Thrust: ship the (header-only) library with the package
          cp -R "$THRUST_DIR/thrust" "$PREFIX/include/thrust"

          # Synchronize data locations for maximum compatibility across install and build paths
          if [ -d "$PREFIX/share/chrono/data" ] && [ ! -d "$PREFIX/data" ]; then
            cp -R "$PREFIX/share/chrono/data" "$PREFIX/data"
          elif [ -d "$PREFIX/data" ] && [ ! -d "$PREFIX/share/chrono/data" ]; then
            mkdir -p "$PREFIX/share/chrono"
            cp -R "$PREFIX/data" "$PREFIX/share/chrono/data"
          fi

          # Prune unused large datasets to reduce archive size (~1.1 GB -> ~100 MB)
          for d in "$PREFIX/data" "$PREFIX/share/chrono/data"; do
            if [ -d "$d" ]; then
              rm -rf "$d"/sensor "$d"/robot "$d"/fsi-tdpf "$d"/fsi-sph "$d"/synchrono "$d"/vsg "$d"/testing "$d"/cosimulation "$d"/models "$d"/solidworks
              rm -rf "$d"/vehicle/cosim "$d"/vehicle/fmi "$d"/vehicle/joystick
            fi
          done

          # Include license
          [ -f LICENSE ] && cp LICENSE "$PREFIX/LICENSE-chrono"

          PKG_FILE="$RUNNER_TEMP/chrono-${{ matrix.name }}.${{ matrix.ext }}"
          WIN_PKG_FILE="$PKG_FILE"
          if command -v cygpath >/dev/null 2>&1; then WIN_PKG_FILE="$(cygpath -m "$PKG_FILE")"; fi

          cd "$PREFIX"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            if command -v 7z >/dev/null 2>&1; then
              7z a -tzip -mx=6 "$WIN_PKG_FILE" *
            elif [ -x "/c/Program Files/7-Zip/7z.exe" ]; then
              "/c/Program Files/7-Zip/7z.exe" a -tzip -mx=6 "$WIN_PKG_FILE" *
            else
              powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath '$WIN_PKG_FILE' -Force"
            fi
          else
            tar -czf "$PKG_FILE" *
          fi
          echo "Package created: $PKG_FILE ($(du -h "$PKG_FILE" 2>/dev/null || ls -lh "$PKG_FILE"))"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrono-${{ matrix.name }}
          path: ${{ runner.temp }}/chrono-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release packages
    needs: build
    runs-on: ubuntu-24.04
    # never publish two releases at once (the rolling "latest" / branch releases would race)
    concurrency:
      group: chrono-release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: chrono-*
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Files to release:"
          ls -la dist/

          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:10}"
          REF_NAME="${{ github.ref_name }}"
          COMMIT_TAG="chrono-${SHA}"

          COMMIT_NOTES="Automated prebuilt packages for Project Chrono at commit $SHA (branch: $REF_NAME), configured for consumption by OpenMultiPhysics."
          echo "== Publishing release for commit tag: $COMMIT_TAG"
          if ! gh release view "$COMMIT_TAG" >/dev/null 2>&1; then
            gh release create "$COMMIT_TAG" \
              --target "$SHA" \
              --title "Project Chrono $SHORT_SHA" \
              --notes "$COMMIT_NOTES" \
              dist/*
          else
            gh release edit "$COMMIT_TAG" --notes "$COMMIT_NOTES" >/dev/null 2>&1 || true
            gh release upload "$COMMIT_TAG" dist/* --clobber
          fi

          # Update rolling release for primary branches (develop, main, master)
          if [ "$REF_NAME" = "develop" ] || [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "master" ]; then
            BRANCH_NOTES="Rolling prebuilt packages for branch $REF_NAME (commit $SHA) for consumption by OpenMultiPhysics."
            echo "== Updating branch rolling release for: $REF_NAME"
            if ! gh release view "$REF_NAME" >/dev/null 2>&1; then
              gh release create "$REF_NAME" \
                --target "$SHA" \
                --title "Project Chrono ($REF_NAME)" \
                --notes "$BRANCH_NOTES" \
                dist/*
            else
              gh release edit "$REF_NAME" --target "$SHA" --notes "$BRANCH_NOTES" >/dev/null 2>&1 || true
              gh release upload "$REF_NAME" dist/* --clobber
            fi

            LATEST_NOTES="Rolling latest release packages of Project Chrono built for automated consumption by OpenMultiPhysics (Linux x86_64, Windows x86_64, macOS Apple Silicon arm64; with Chrono::Multicore). Built from commit $SHA on branch $REF_NAME."
            echo "== Updating latest release"
            if ! gh release view "latest" >/dev/null 2>&1; then
              gh release create "latest" \
                --target "$SHA" \
                --title "Project Chrono (latest for OpenMultiPhysics)" \
                --notes "$LATEST_NOTES" \
                dist/*
            else
              gh release edit "latest" --target "$SHA" --title "Project Chrono (latest for OpenMultiPhysics)" --notes "$LATEST_NOTES" >/dev/null 2>&1 || true
              gh release upload "latest" dist/* --clobber
            fi
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "== Updating tag release for: $REF_NAME"
            if ! gh release view "$REF_NAME" >/dev/null 2>&1; then
              gh release create "$REF_NAME" \
                --target "$SHA" \
                --title "Project Chrono $REF_NAME" \
                --notes "Prebuilt packages for tag $REF_NAME." \
                dist/*
            else
              gh release upload "$REF_NAME" dist/* --clobber
            fi
          fi
